# Default values for joa-rt1query.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


global:
  name: joa-rt1query
  
replicaCount: 1

persistence:
  enabled: true

image:
  # docker pull registry/repository:tag
  registry: ${artifactory.url}
  repository: joa-rt1query
  pullPolicy: IfNotPresent
  tag: ${rt1-query.version}

startupProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 20
  timeoutSeconds: 3
  httpGet:
    port: 28082

livenessProbe:
  failureThreshold: 3
  initialDelaySeconds: 15
  periodSeconds: 60
  successThreshold: 1
  timeoutSeconds: 3
  httpGet:
    port: 28082

nodeSelector: {}

tolerations: []

affinity: {}