apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-joa-rt1query
  labels:
    app: joa-rt1query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joa-rt1query
  template:
    metadata:
      labels:
        app: joa-rt1query
    spec:
      containers:
      - name: local-joa-rt1query
        image: joa-rt1query
        imagePullPolicy: IfNotPresent
        env:
          - name: SPRING_CLOUD_NACOS_SERVER_ADDR
            value: joa-nacos-cs
        envFrom:
          - configMapRef:
              name: joa-rt1query-config
        volumeMounts:
          - mountPath: /joa/config
            name: rt1query-volume
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 28082
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 20
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 28082
          initialDelaySeconds: 15
          periodSeconds: 60
          failureThreshold: 3
          timeoutSeconds: 3
      volumes:
        - name: rt1query-volume
          hostPath:
            path: /joa/rt1query/config
            type: DirectoryOrCreate