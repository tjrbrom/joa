apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-joa-rt1agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joa-rt1agent
  template:
    metadata:
      labels:
        app: joa-rt1agent
    spec:
      containers:
      - name: local-joa-rt1agent
        image: joa-rt1agent
        imagePullPolicy: IfNotPresent
        env:
          - name: SPRING_CLOUD_NACOS_SERVER_ADDR
            value: joa-nacos-cs
        envFrom:
          - configMapRef:
              name: joa-rt1agent-config
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 28080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 20
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 28080
          initialDelaySeconds: 15
          periodSeconds: 60
          failureThreshold: 3
          timeoutSeconds: 3
