apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "joa-gateway.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "joa-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "joa-gateway.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ include "joa-gateway.fullname" . }}
        image: "{{ tpl .Values.image.registry . }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          {{- if .Values.global.CORE_FLUENTD_SERVICE_HOST }}
          - name: CORE_FLUENTD_SERVICE_HOST
            value: {{ .Values.global.CORE_FLUENTD_SERVICE_HOST | quote }}
          {{- end }}
          {{- if .Values.global.CORE_FLUENTD_SERVICE_PORT }}
          - name: CORE_FLUENTD_SERVICE_PORT
            value: {{ .Values.global.CORE_FLUENTD_SERVICE_PORT | quote }}
          {{- end }}
        startupProbe:
{{ toYaml .Values.startupProbe | indent 10 }}
        livenessProbe:
{{ toYaml .Values.livenessProbe | indent 10 }}