# Default values for joa-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  name: joa-gateway
env:
  name: joa-gateway

replicaCount: 1

image:
  # docker pull registry/repository:tag
  registry: ${artifactory.url}
  repository: joa-gateway
  pullPolicy: IfNotPresent
  tag: ${joa-gateway.version}

service:
  type: NodePort
  ports:
    protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30800

startupProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 20
  successThreshold: 1
  timeoutSeconds: 3
  httpGet:
    scheme: HTTP
    path: /actuator/health
    port: 8080

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 60
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 3
  httpGet:
    scheme: HTTP
    path: /actuator/health
    port: 8080

nameOverride: ""
fullnameOverride: ""

nodeSelector: {}

tolerations: []

affinity: {}
