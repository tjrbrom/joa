[JIRA]

# definition of server is currently mandatory : this may be changed in future hooks-code releases

# if the project does not use JIRA, comment out the proxy definition and set other JIRA definitions to false

# the hooks-code will then not enforce any JIRA policies

# server=&lt;server url&gt;

#server=https://atlassianwave.web.y.com/jira

#server=https://greenhopper.app.y.com/

#server=https://jiradc.ext.net.x.com/

server=https://jiradc2.ext.net.x.com/

#server=https://jira3.int.net.x.com/

# JIRA definitions below this point are optional

# proxy=&lt;proxy url&gt;

#proxy=https://proxy.lbs.y.com:8000

#jiraIDPatternOverwrittenValue=patternxyz

#jiraIDPatternOverwrittenValue=([A-Z0-9_]+-[0-9]+[,:]+)

#jira_reg_exp=([A-Z0-9_]+-[0-9]+[,:]+)

#preventrenamesordeletions=true

jiraidmandatory=true

checkidinjira=false

jiraidmatch=false

usermatch=false

#validstates=In Progress

multi_jira=false

#validstates=Open,Reopened,In Progress

#updatejirawithchangeset=true

#scmfield=comments

#jiraIDPatternOverwrittenValue=xyz
