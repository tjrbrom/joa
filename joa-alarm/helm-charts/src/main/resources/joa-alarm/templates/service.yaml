apiVersion: v1
kind: Service
metadata:
  name: {{ include "joa-alarm.fullname" . }}
spec:
  type: NodePort
  selector:
    app: {{ .Chart.Name }}
  ports:
    {{- if .Values.env.JOA_ALARM_SERVER_CHANNEL_NUMBER}}
    {{- $channelNumber := .Values.env.JOA_ALARM_SERVER_CHANNEL_NUMBER | int }}
    {{- $portStart := (.Values.env.JOA_ALARM_SERVER_PORT | default 31232) | int }}
    {{- range $i, $ := until $channelNumber }}
    - name: joa-alarm-netty-server-port-{{ add $i }}
      protocol: TCP
      port: {{ add $portStart $i }}
      targetPort: {{ add $portStart $i }}
      nodePort: {{ add $portStart $i }}
    {{- end }}
    {{- end }}
