apiVersion: v1
kind: Service
metadata:
  name: "{{ include "joa-alarm.fullname" . }}-internal"
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      protocol: {{ .protocol }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
    {{- end }}
