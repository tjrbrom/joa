management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  servlet.multipart.enabled: true
  servlet.multipart.max-file-size: 5MB
  servlet.multipart.max-request-size: 10MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: ${joa-alarm.datasource.url}/${joa-alarm.datasource.schema}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=Asia/Shanghai&allowMultiQueries=true&failOverReadOnly=false&autoReconnect=true
          username: ${joa-alarm.datasource.username}
          password: ${joa-alarm.datasource.password}
          driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    # Manually migrate db with flyway bean
    enabled: false
    locations: classpath:db/migration/
    url: ${joa-alarm.datasource.url}
    user: ${joa-alarm.datasource.username}
    password: ${joa-alarm.datasource.password}
    table: joa_alarm_schema_history
    placeholders:
      joa-alarm-schema: ${joa-alarm.datasource.schema}
    schemas:
      - ${joa-alarm.datasource.schema}
    baselineOnMigrate: true
    baselineVersion: 0
  kafka:
    bootstrap-servers: 10.182.100.163:9093
    security:
      protocol: ssl
    ssl:
      key-store-location: file:/joa/kafka/keystore/keyStore
      key-store-password: ${KAFKA_KEYSTORE_PASSWORD}
      key-password: ${KAFKA_KEY_PASSWORD}
      trust-store-location: file:/joa/kafka/keystore/trustStore
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD}
      key-store-type: JKS
    consumer:
      group-id: joa-alarm
      enable-auto-commit: false
      max-poll-records: 500
      auto-offset-reset: latest
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      poll-timeout: 3000
      concurrency: 1
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
#  cache:
#    cache-names:
#      - getDeviceIp
#      - getOnuId
#      - retrieveXJsonAlarmInfo
#      - queryDeviceInfo
#      - querySlotPlannedType
#      - retrieveCoreSiteName
#    caffeine:
#      spec: maximumSize=${joa-alarm.xalarm2joaalarm.cache.max-size},expireAfterWrite=${joa-alarm.xalarm2joaalarm.cache.expire-minutes}m

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.x.hhqs.joa.alarm.entity
  type-enums-package: com.x.hhqs.joa.alarm.entity
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    org.opendaylight.yangtools: ERROR
