joa-alarm:
  xalarm2joaalarm:
    category-mapping:
      equipment-alarm: EquipmentAlarm
      communications-alarm: CommunicationAlarm
      processing-error-alarm: ProcessingFailure
      quality-of-service-alarm: QualityOfServiceAlarm
      environmental-alarm: EnvironmentalAlarm
      bfdAlarm: ProcessingFailure
      dhcpAlarm: EquipmentAlarm
      eqptAlarm: EquipmentAlarm
      ethcfmAlarm: EquipmentAlarm
      ipAlarm: EquipmentAlarm
      isisAlarm: ProcessingFailure
      lagAlarm: EquipmentAlarm
      ldpAlarm: ProcessingFailure
      mplsAlarm: ProcessingFailure
      onu-alarm: EquipmentAlarm
      ospfAlarm: ProcessingFailure
      portAlarm: EquipmentAlarm
      rpf-base-alarm: ProcessingFailure
      rsvpAlarm: ProcessingFailure
      securityAlarm: ProcessingFailure
      serviceAlarm: QualityOfServiceAlarm
      stpAlarm: EquipmentAlarm
      systemAlarm: ProcessingFailure
      vrtrAlarm: EquipmentAlarm
    cache:
      max-size: 500
      expire-minutes: 5
    allowed-origins: x-core-av_ALARM,x-core-ac_ALARM
    topic: x-core-alarm
