    realm: master
    token: /realms/${joa-alarm.keycloak.realm}/protocol/openid-connect/token
    resource: CORE
    credentials:
      secret: a9428765-ddc4-485c-8bf1-897f39264eb2
  sftp:
    path: /export/alarm
    ip: 10.99.88.61
    port: 22
    user: amssys
    password: amssys
    file-delete: true
    file-auto-delete-strategy:
      keep: 3 days
    type: sftp
  database-keep-days: 7
  alarm-log:
