{{- if eq .Values.storage.type "mysql"}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-cm
  namespace: {{ .Values.namespace }}
data:
  {{- with .Values.storage.db }}
  mysql.db.host: {{.host}}
  mysql.db.name: {{ .name | default "nacos" }}
  mysql.port: "{{ .port | default 3306}}"
  mysql.user: {{ .username }}
  mysql.password: {{ .password }}
  mysql.param: {{ .param }}
  {{- end }}
  {{- end }}



