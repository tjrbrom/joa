{{- if (and (index .Values "joa-rt1-keyclock-init" "enabled") .Values.tags.rt1) -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "joa.app" . }}-rt1-keyclock-init
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
spec:
  backoffLimit: {{ index .Values "joa-rt1-keyclock-init" "spec" "backoffLimit" }}
  activeDeadlineSeconds: {{ index .Values "joa-rt1-keyclock-init" "spec" "activeDeadlineSeconds" }}
  ttlSecondsAfterFinished: {{ index .Values "joa-rt1-keyclock-init" "spec" "ttlSecondsAfterFinished" }}
  template:
    spec:
      containers:
        - name: {{ template "joa.app" . }}-rt1-keyclock-init
          image: "{{ tpl .Values.joaTools.image.registry . }}/{{ .Values.joaTools.image.repository }}:{{ .Values.joaTools.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.joaTools.image.pullPolicy }}
          command: ['sh', '-c', 'sh -x /tmp/joa-rt1-keyclock-init.sh "core-sso:8443" "{{ .Values.global.KEYCLOAK_USERNAME | default "admin" }}" "{{ .Values.global.KEYCLOAK_PASSWORD | default "admin" }}" "{{ .Values.global.KEYCLOAK_JOA_PASSWORD | default "12345678" }}" "/tmp/CORE_JOA.json" "/tmp/CORE_JOA-authz-config.json"']
          env:
          {{- range $key, $value := index .Values "joa-rt1-keyclock-init" "env" }}
            - name: {{ $key | quote }}
              value: {{ tpl $value $ | quote }}
          {{- end }}
      restartPolicy: Never
{{- end }}