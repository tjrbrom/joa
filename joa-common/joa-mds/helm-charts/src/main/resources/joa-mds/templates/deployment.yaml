
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "joa-mds.fullname" . }}
  labels:
    {{- include "joa-mds.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "joa-mds.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "joa-mds.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ include "joa-mds.fullname" . }}
        image: "{{ tpl .Values.image.registry . }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          {{- if .Values.global.SPRING_CLOUD_NACOS_SERVER_ADDR }}
          - name: SPRING_CLOUD_NACOS_SERVER_ADDR
            value: {{ .Values.global.SPRING_CLOUD_NACOS_SERVER_ADDR | quote }}
          {{- end }}
          {{- if .Values.global.CORE_FLUENTD_SERVICE_HOST }}
          - name: CORE_FLUENTD_SERVICE_HOST
            value: {{ .Values.global.CORE_FLUENTD_SERVICE_HOST | quote }}
          {{- end }}
          {{- if .Values.global.CORE_FLUENTD_SERVICE_PORT }}
          - name: CORE_FLUENTD_SERVICE_PORT
            value: {{ .Values.global.CORE_FLUENTD_SERVICE_PORT | quote }}
          {{- end }}
        {{- if not .Values.env.AMS_USE_CONFIGURED_CREDENTIALS }}
        volumeMounts:
          - mountPath: /joa/mds/secret/
            name: component-all-keys-storage
        {{- end }}
        startupProbe:
          initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          httpGet:
            path: /actuator/health
            port: {{ .Values.startupProbe.httpGet.port }}
        livenessProbe:
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          httpGet:
            scheme: HTTP
            path: /actuator/health
            port: {{ .Values.livenessProbe.httpGet.port }}
      {{- if not .Values.env.AMS_USE_CONFIGURED_CREDENTIALS }}
      volumes:
        {{- include "keys.volumes.all-keys-storage" . | nindent 8 }}
      {{- end }}

