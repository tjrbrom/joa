server.port: 19099

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: joa-mds
  autoconfigure:
    exclude: com.x.hhqs.joa.common.restclient.RestClientConfiguration
  cloud:
    nacos:
      server-addr: 10.99.88.214:30849
  config:
    enabled: true
    import:
    - nacos:joa-common.properties?refresh=true
    - nacos:joa-mds.properties?refresh=true

core:
  rest:
    baseUrl: https://10.99.88.153/x-core-ac
    username: adminuser
    password: password

ams:
  use-configured-credentials: false
  username: admin
  password: admin1234

secretkey:
  path: classpath:META-INF/keyfile.plain
    
joa.mds:
  sync-task:
    interval-minutes: 60
    manager-types:
    - AMS
    - NAV
    intent-types:
    - device-mf

