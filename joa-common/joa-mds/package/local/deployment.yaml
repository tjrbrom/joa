apiVersion: apps/v1
kind: Deployment
metadata:
  name: joa-mds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joa-mds
  template:
    metadata:
      labels:
        app: joa-mds
    spec:
      containers:
      - name: joa-mds
        image: joa-mds
        imagePullPolicy: IfNotPresent
        env:
          # - name: NAME
          #   value: value
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 20
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 60
          failureThreshold: 3
          timeoutSeconds: 3
